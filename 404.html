<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      var newDomain = "https://openhwfoundation.github.io";

      // Reconstruct full path: domain + path + ?query + #hash
      var targetUrl = newDomain + window.location.pathname + window.location.search + window.location.hash;

      window.location.replace(targetUrl);
    </script>
  </head>
  <body>
    <p>This page has moved. <a id="redirect-link" href="https://openhwfoundation.github.io">Click here to go to the new location</a>.</p>
    <script type="text/javascript">
      document.getElementById('redirect-link').href = targetUrl;
    </script>
  </body>
</html>
